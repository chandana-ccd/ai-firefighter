name: AI Firefighter CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  validate:
    name: Validate AI Firefighter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository files
        run: |
          echo "Checking AI Firefighter repository..."

          test -f PaymentService.java || exit 1
          test -f Customer.java || exit 1
          test -f ReproduceBug.java || exit 1

          echo "Required files found."

      - name: Verify PaymentService fix
        if: github.event_name == 'pull_request'
        run: |
          echo "Checking null-handling fix..."

          grep -q "String customerName = customer.getName();" PaymentService.java
          grep -q "if (customerName == null)" PaymentService.java
          grep -q "customerName = customerName.trim();" PaymentService.java

          echo "Null-handling fix verified."

      - name: Verify reproduction test
        run: |
          echo "Checking sandbox reproduction..."

          test -f ReproduceBug.java

          echo "Reproduction test found."

      - name: Validation complete
        run: |
          echo "================================"
          echo "AI Firefighter CI PASSED"
          echo "================================"